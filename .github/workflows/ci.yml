name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Linux windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Core and scene dependency boundary
        shell: bash
        run: |
          for crate in engine_core engine_scene; do
            if cargo tree -p "$crate" -e normal | grep -E '(rayon|minifb|winit|wgpu|rodio|enigo) v[0-9]'; then
              echo "$crate must not depend on renderer or desktop packages"
              exit 1
            fi
          done

      - name: Engine game-content boundary
        shell: bash
        run: |
          if grep -riE 'studs|warden|page|enemy|monster|crawl|flashlight|maze|jumpscare' \
            engine_core engine_scene render_cpu render_gpu platform; then
            echo "Engine crates contain game-specific vocabulary"
            exit 1
          fi
          for crate in engine_core engine_scene render_cpu render_gpu platform; do
            if cargo tree -p "$crate" -e normal | grep -i 'studs'; then
              echo "$crate must not depend on the studs game"
              exit 1
            fi
          done

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Validate processed assets and manifest
        run: python tools/fetch_assets.py --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build examples
        run: cargo build --locked --workspace --examples
      - name: Engine-only minimal app
        run: cargo run --locked -p platform --example minimal_app -- --headless
      - name: Level probe
        if: runner.os == 'Linux'
        run: cargo run --release --locked -p render_cpu --example level_probe

  release-build:
    name: Release binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --locked --workspace --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp -r studs/assets dist/assets
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/raycast_blocks.exe dist/
          else
            cp target/release/raycast_blocks dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: raycast_blocks-${{ runner.os }}
          path: dist
