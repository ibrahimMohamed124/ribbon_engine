name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Run engine examples
        run: |
          cargo run --locked -p hello_ecs
          cargo run --locked -p voxel_room -- --renderer cpu --headless
          cargo run --locked -p editor_demo
      - name: GPU fixture parity and engine-only headless examples
        if: runner.os == 'Linux'
        run: |
          WGPU_BACKEND=vulkan cargo test --locked -p voxelworks-render-gpu --test parity -- --nocapture
          cargo run --locked -p voxelworks-minimal -- --headless --renderer cpu
          WGPU_BACKEND=vulkan cargo run --locked -p voxelworks-minimal -- --headless --renderer gpu

  test-no-default-features:
    name: Build & test without optional platform features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build without default features
        run: cargo build --locked --workspace --all-targets --no-default-features
      - name: Run headless examples without default features
        run: |
          cargo run --locked -p hello_ecs --no-default-features
          cargo run --locked -p voxel_room --no-default-features -- --renderer cpu --headless
      - name: Test without default features
        run: cargo test --locked --workspace --no-default-features
      - name: Verify platform optional dependencies are absent
        shell: bash
        run: |
          if cargo tree --locked -p voxelworks-platform --no-default-features -e normal | grep -E '(wgpu|rodio) v[0-9]'; then
            echo "GPU and audio dependencies must be optional platform features"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Linux windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Legacy crates do not pull optional backends by default-off
        shell: bash
        run: |
          # Direct edges are policed by tools/check_deps.py. This step checks the
          # transitive result: without the gpu/audio features no legacy crate may
          # compile wgpu, rodio or the CPU thread pool unless it owns the CPU renderer.
          for crate in voxelworks-core voxelworks-scene voxelworks-api voxelworks-testkit voxelworks-platform; do
            if cargo tree --locked -p "$crate" --no-default-features -e normal | grep -E '(wgpu|rodio|rayon|minifb|enigo) v[0-9]'; then
              echo "$crate must not depend on GPU, audio or rayon without the matching feature"
              exit 1
            fi
          done

      - name: New workspace dependency policy
        run: python tools/check_deps.py

      - name: Engine dependency and game-content boundary
        shell: bash
        run: |
          if cargo tree --locked -p engine_ecs -e normal --depth 1 --prefix none | grep -vE '^(engine_ecs|hecs) v'; then
            echo "engine_ecs may depend only on hecs"
            exit 1
          fi
          if cargo tree --locked -p engine_math -e normal --depth 1 --prefix none | grep -v '^engine_math v'; then
            echo "engine_math must have no dependencies"
            exit 1
          fi
          if rg -n -i 'studs|warden|crawlmaster|vividcharacters' crates plugins; then
            echo "Engine crates contain game-specific vocabulary"
            exit 1
          fi

      - name: Engine game-content boundary
        shell: bash
        run: |
          if grep -riE 'studs|warden|page|enemy|monster|crawl|flashlight|maze|jumpscare' \
            crates plugins engine/crates/core engine/crates/scene engine/crates/api engine/crates/render-cpu engine/crates/render-gpu engine/crates/platform engine/crates/testkit; then
            echo "Engine crates contain game-specific vocabulary"
            exit 1
          fi
          for crate in voxelworks-core voxelworks-scene voxelworks-api voxelworks-render-cpu voxelworks-render-gpu voxelworks-platform voxelworks-testkit; do
            if cargo tree -p "$crate" -e normal | grep -i 'studs'; then
              echo "$crate must not depend on the studs game"
              exit 1
            fi
          done

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Validate processed assets and manifest
        run: python games/studs/tools/fetch_assets.py --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build examples
        run: cargo build --locked --workspace --examples
      - name: Engine-only minimal app
        run: cargo run --locked -p voxelworks-minimal -- --headless
      - name: Level probe
        if: runner.os == 'Linux'
        run: cargo run --release --locked -p voxelworks-render-cpu --example level_probe

  release-build:
    name: Release binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --locked --workspace --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp -r games/studs/assets dist/assets
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/studs.exe dist/
          else
            cp target/release/studs dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: studs-${{ runner.os }}
          path: dist
