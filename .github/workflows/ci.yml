name: CI

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && 'ribbon-windows' || matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-C link-arg=-fuse-ld=bfd' || '' }}
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.os == 'macos-latest' && '2' || '0' }}
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.os == 'macos-latest' && '2' || '0' }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows-latest' && '2' || 'default' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use runner temporary directory for Windows builds
        if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'

      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Run engine examples
        run: |
          cargo run --locked -p hello_ecs
          cargo run --locked -p voxel_room -- --renderer cpu --headless
          cargo run --locked -p editor_demo
      - name: GPU mesh lifecycle and legacy-backend retirement regressions
        if: runner.os == 'Linux'
        run: |
          RIBBON_REQUIRE_GPU_TESTS=1 cargo test --locked -p ribbon_plugin_render3d dynamic_chunk_meshes_upload_replace_and_evict_without_stale_gpu_entries -- --nocapture
          cargo test --locked -p ribbon_plugin_rendering --test legacy_gpu_backend_retired -- --nocapture

  test-no-default-features:
    name: Build & test without optional platform features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build without default features
        run: cargo build --locked --workspace --all-targets --no-default-features
      - name: Run headless examples without default features
        run: |
          cargo run --locked -p hello_ecs --no-default-features
          cargo run --locked -p voxel_room --no-default-features -- --renderer cpu --headless
      - name: Test without default features
        run: cargo test --locked --workspace --no-default-features
      - name: Verify platform optional dependencies are absent
        shell: bash
        run: |
          if cargo tree --locked -p ribbon_render --no-default-features -e normal | grep -E 'wgpu v[0-9]'; then
            echo "ribbon_render must not pull wgpu when its gpu feature is disabled"
            exit 1
          fi
          if cargo tree --locked -p ribbon_plugin_audio --no-default-features -e normal | grep -E 'rodio v[0-9]'; then
            echo "ribbon_plugin_audio must not pull rodio when its audio feature is disabled"
            exit 1
          fi
          if cargo tree --locked -p ribbon_plugin_rendering --no-default-features -e normal | grep -E '(wgpu|rayon) v[0-9]'; then
            echo "ribbon_plugin_rendering must not pull optional GPU/CPU backends when all features are disabled"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Linux windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: New workspace dependency policy
        run: python tools/check_deps.py

      - name: Engine dependency and game-content boundary
        shell: bash
        run: |
          if cargo tree --locked -p ribbon_ecs -e normal --depth 1 --prefix none | grep -vE '^(ribbon_ecs|hecs) v'; then
            echo "ribbon_ecs may depend only on hecs"
            exit 1
          fi
          if cargo tree --locked -p ribbon_math -e normal --depth 1 --prefix none | grep -v '^ribbon_math v'; then
            echo "ribbon_math must have no dependencies"
            exit 1
          fi
          if rg -n -i 'studs|warden|crawlmaster|vividcharacters' crates plugins; then
            echo "Engine crates contain game-specific vocabulary"
            exit 1
          fi

      - name: Engine game-content boundary
        shell: bash
        run: |
          if grep -riE 'studs|warden|page|enemy|monster|crawl|flashlight|maze|jumpscare' crates plugins; then
            echo "Engine crates contain game-specific vocabulary"
            exit 1
          fi
          if rg -n 'voxelworks-(core|scene|api|render-cpu|render-gpu|platform|minimal)' Cargo.toml crates plugins examples games tools .github; then
            echo "Retired compatibility packages must not re-enter active source or CI"
            exit 1
          fi

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Validate processed assets and manifest
        run: python games/studs/tools/fetch_assets.py --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build examples
        run: cargo build --locked --workspace --examples
      - name: Level probe
        if: runner.os == 'Linux'
        run: cargo run --release --locked -p ribbon_plugin_rendering --example level_probe

  release-build:
    name: Release binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && 'ribbon-windows' || matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-C link-arg=-fuse-ld=bfd' || '' }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows-latest' && '1' || 'default' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use runner temporary directory for Windows builds
        if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment != 'self-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'

      - name: Build release
        run: cargo build --locked --workspace --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp -r games/studs/assets dist/assets
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/studs.exe dist/
          else
            cp target/release/studs dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: studs-${{ runner.os }}
          path: dist
