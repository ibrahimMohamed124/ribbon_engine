[package]
name = "voxelworks-minimal"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu", "audio"]
gpu = ["voxelworks-platform/gpu"]
audio = ["voxelworks-platform/audio"]

[dependencies]
voxelworks-core = { path = "../../crates/core" }
voxelworks-scene = { path = "../../crates/scene" }
voxelworks-api = { path = "../../crates/api" }
voxelworks-platform = { path = "../../crates/platform", default-features = false }
voxelworks-render-cpu = { path = "../../crates/render-cpu" }
