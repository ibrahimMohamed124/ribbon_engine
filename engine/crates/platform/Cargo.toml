[package]
name = "voxelworks-platform"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu", "audio"]
gpu = ["dep:voxelworks-render-gpu"]
audio = ["plugin_audio/audio"]

[dependencies]
voxelworks-core = { path = "../core" }
voxelworks-scene = { path = "../scene" }
voxelworks-api = { path = "../api" }
engine_platform = { path = "../../../crates/engine_platform" }
engine_render = { path = "../../../crates/engine_render" }
winit = "0.30.13"
softbuffer = "0.4.6"
voxelworks-render-gpu = { path = "../render-gpu", optional = true }
plugin_audio = { path = "../../../plugins/audio" }

[dev-dependencies]
voxelworks-render-cpu = { path = "../render-cpu" }
