[package]
name = "engine_render"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu"]
gpu = ["dep:wgpu"]

[dependencies]
engine_app = { path = "../engine_app" }
engine_plugins = { path = "../engine_plugins" }
engine_platform = { path = "../engine_platform" }
engine_assets = { path = "../engine_assets" }
engine_math = { path = "../engine_math" }
wgpu = { version = "25.0.2", optional = true }
