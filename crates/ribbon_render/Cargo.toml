[package]
name = "ribbon_render"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
ribbon_app = { path = "../ribbon_app" }
ribbon_plugins = { path = "../ribbon_plugins" }
ribbon_platform = { path = "../ribbon_platform" }
ribbon_assets = { path = "../ribbon_assets" }
ribbon_math = { path = "../ribbon_math" }
wgpu = { version = "25.0.2", optional = true }
pollster = { version = "0.4", optional = true }
