[package]
name = "studs"
version = "0.3.0"
edition = "2021"

[lib]
name = "studs"
path = "src/lib.rs"

[[bin]]
name = "studs"
path = "src/main.rs"

[features]
default = ["gpu", "audio"]
gpu = ["voxelworks-platform/gpu"]
audio = ["voxelworks-platform/audio"]

[dependencies]
voxelworks-core = { path = "../../engine/crates/core" }
voxelworks-api = { path = "../../engine/crates/api" }
engine_render = { path = "../../crates/engine_render", default-features = false }
plugin_rendering = { path = "../../plugins/rendering", default-features = false, features = ["cpu"] }
voxelworks-render-cpu = { path = "../../engine/crates/render-cpu" }
voxelworks-platform = { path = "../../engine/crates/platform", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
