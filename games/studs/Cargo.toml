[package]
name = "studs"
version = "0.3.0"
edition = "2021"

[lib]
name = "studs"
path = "src/lib.rs"

[[bin]]
name = "studs"
path = "src/main.rs"

[features]
default = ["audio", "gpu"]
audio = ["plugin_audio/audio"]
gpu = ["plugin_rendering/gpu", "dep:plugin_render3d"]

[dependencies]
engine_app = { path = "../../crates/engine_app" }
engine_events = { path = "../../crates/engine_events" }
engine_plugins = { path = "../../crates/engine_plugins" }
engine_scene = { path = "../../crates/engine_scene" }
engine_math = { path = "../../crates/engine_math" }
engine_platform = { path = "../../crates/engine_platform" }
engine_render = { path = "../../crates/engine_render", default-features = false }
plugin_audio = { path = "../../plugins/audio", default-features = false }
plugin_physics = { path = "../../plugins/physics" }
plugin_voxel = { path = "../../plugins/voxel" }
plugin_rendering = { path = "../../plugins/rendering", default-features = false, features = ["cpu"] }
plugin_render3d = { path = "../../plugins/render3d", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

