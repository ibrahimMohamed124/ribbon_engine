[package]
name = "studs"
version = "0.3.0"
edition = "2021"

[lib]
name = "studs"
path = "src/lib.rs"

[[bin]]
name = "studs"
path = "src/main.rs"

[features]
default = ["audio", "gpu"]
audio = ["ribbon_plugin_audio/audio"]
# STUDS GPU rendering is the engine's mesh renderer; do not enable the legacy raycaster backend.
gpu = ["dep:ribbon_plugin_render3d"]

[dependencies]
ribbon_app = { path = "../../crates/ribbon_app" }
ribbon_events = { path = "../../crates/ribbon_events" }
ribbon_plugins = { path = "../../crates/ribbon_plugins" }
ribbon_scene = { path = "../../crates/ribbon_scene" }
ribbon_math = { path = "../../crates/ribbon_math" }
ribbon_platform = { path = "../../crates/ribbon_platform" }
ribbon_render = { path = "../../crates/ribbon_render", default-features = false }
ribbon_plugin_audio = { path = "../../plugins/audio", default-features = false }
ribbon_plugin_physics = { path = "../../plugins/physics" }
ribbon_plugin_voxel = { path = "../../plugins/voxel" }
ribbon_plugin_rendering = { path = "../../plugins/rendering", default-features = false, features = ["cpu"] }
ribbon_plugin_render3d = { path = "../../plugins/render3d", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

