[package]
name = "studs_cpu_renderer"
version = "0.1.0"
edition = "2021"

[features]
default = ["cpu"]
cpu = ["dep:rayon"]

[dependencies]
ribbon_app = { path = "../../../../crates/app" }
ribbon_plugins = { path = "../../../../crates/plugins" }
ribbon_ecs = { path = "../../../../crates/ecs" }
ribbon_events = { path = "../../../../crates/events" }
ribbon_assets = { path = "../../../../crates/assets" }
ribbon_platform = { path = "../../../../crates/platform" }
ribbon_scene = { path = "../../../../crates/scene" }
ribbon_math = { path = "../../../../crates/math" }
studs_voxel = { path = "../studs_voxel" }
ribbon_render = { path = "../../../../crates/render", default-features = false }
rayon = { version = "1.10", optional = true }

[[example]]
name = "level_probe"
required-features = ["cpu"]

[[example]]
name = "render_bench"
required-features = ["cpu"]

[[example]]
name = "screenshot"
required-features = ["cpu"]
