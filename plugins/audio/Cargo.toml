[package]
name = "ribbon_plugin_audio"
version = "0.1.0"
edition = "2021"

[features]
default = ["audio"]
audio = ["dep:rodio"]

[dependencies]
ribbon_app = { path = "../../crates/ribbon_app" }
ribbon_plugins = { path = "../../crates/ribbon_plugins" }
ribbon_ecs = { path = "../../crates/ribbon_ecs" }
ribbon_events = { path = "../../crates/ribbon_events" }
ribbon_math = { path = "../../crates/ribbon_math" }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"], optional = true }
