[package]
name = "ribbon_plugin_audio"
version = "0.1.0"
edition = "2021"

[features]
default = ["audio"]
# Preferred production backend: Kira owns the mixer and audio-device thread.
audio = ["dep:kira"]
# Optional compatibility backend for applications that still explicitly use Rodio APIs.
rodio-compat = ["dep:rodio"]
# Optional Valve Steam Audio SDK integration for true HRTF/binaural processing.
# Enabling this feature auto-installs the native SDK at build time.
steam-audio = ["audio", "dep:audionimbus"]

[dependencies]
ribbon_app = { path = "../../crates/app" }
ribbon_plugins = { path = "../../crates/plugins" }
ribbon_ecs = { path = "../../crates/ecs" }
ribbon_events = { path = "../../crates/events" }
ribbon_assets = { path = "../../crates/assets" }
ribbon_math = { path = "../../crates/math" }
ribbon_scene = { path = "../../crates/scene" }
# The audio ECS adapter reads the quaternion and world-space translation from the
# scene's modern GlobalTransform3D. Keep this dependency local to the integration
# boundary; ribbon_math and the legacy scene transform API remain unchanged.
glam = "0.30"
kira = { version = "=0.12.5", optional = true, default-features = false, features = ["cpal", "symphonia", "aiff", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"], optional = true }
audionimbus = { version = "=0.16.0", default-features = false, features = ["auto-install"], optional = true }

[[example]]
name = "audio_engine_showcase"
path = "examples/audio_engine_showcase.rs"
required-features = ["audio"]

[[example]]
name = "audio_priority_stress"
path = "examples/audio_priority_stress.rs"
required-features = ["steam-audio"]

[[example]]
name = "audio_stress"
path = "examples/audio_stress.rs"
required-features = ["steam-audio"]
