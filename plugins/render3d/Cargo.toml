[package]
name = "ribbon_plugin_render3d"
version = "0.1.0"
edition = "2021"

[dependencies]
ribbon_app = { path = "../../crates/ribbon_app" }
ribbon_assets = { path = "../../crates/ribbon_assets" }
ribbon_plugins = { path = "../../crates/ribbon_plugins" }
ribbon_render = { path = "../../crates/ribbon_render", default-features = false, features = ["gpu"] }
ribbon_scene = { path = "../../crates/ribbon_scene" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
ribbon_plugin_gltf = { path = "../gltf" }
ribbon_plugin_voxel = { path = "../voxel" }
pollster = "0.4"
wgpu = "25.0.2"

[dev-dependencies]
naga = { version = "25.0.1", features = ["wgsl-in"] }
png = "0.18"
