[package]
name = "ribbon_plugin_render3d"
version = "0.1.0"
edition = "2021"

[dependencies]
ribbon_reflect = { path = "../../crates/reflect" }
ribbon_ecs = { path = "../../crates/ecs" }
ribbon_app = { path = "../../crates/app" }
ribbon_assets = { path = "../../crates/assets" }
ribbon_plugins = { path = "../../crates/plugins" }
ribbon_render = { path = "../../crates/render", default-features = false, features = ["gpu"] }
ribbon_scene = { path = "../../crates/scene" }
ribbon_render_contracts = { path = "../../crates/render_contracts" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
ribbon_plugin_gltf = { path = "../gltf" }
pollster = "0.4"
wgpu = "25.0.2"

[dev-dependencies]
naga = { version = "25.0.1", features = ["wgsl-in"] }
png = "0.18"
