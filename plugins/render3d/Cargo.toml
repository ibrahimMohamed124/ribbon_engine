[package]
name = "plugin_render3d"
version = "0.1.0"
edition = "2021"

[dependencies]
engine_app = { path = "../../crates/engine_app" }
engine_assets = { path = "../../crates/engine_assets" }
engine_plugins = { path = "../../crates/engine_plugins" }
engine_render = { path = "../../crates/engine_render", default-features = false, features = ["gpu"] }
engine_scene = { path = "../../crates/engine_scene" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
plugin_gltf = { path = "../gltf" }
plugin_voxel = { path = "../voxel" }
pollster = "0.4"
wgpu = "25.0.2"

[dev-dependencies]
naga = { version = "25.0.1", features = ["wgsl-in"] }
png = "0.18"
