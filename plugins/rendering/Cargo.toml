[package]
name = "plugin_rendering"
version = "0.1.0"
edition = "2021"

[features]
default = ["cpu", "gpu"]
cpu = ["dep:rayon"]
gpu = ["engine_render/gpu", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
engine_app = { path = "../../crates/engine_app" }
engine_plugins = { path = "../../crates/engine_plugins" }
engine_ecs = { path = "../../crates/engine_ecs" }
engine_events = { path = "../../crates/engine_events" }
engine_assets = { path = "../../crates/engine_assets" }
engine_platform = { path = "../../crates/engine_platform" }
engine_scene = { path = "../../crates/engine_scene" }
engine_math = { path = "../../crates/engine_math" }
plugin_voxel = { path = "../voxel" }
engine_render = { path = "../../crates/engine_render", default-features = false }
rayon = { version = "1.10", optional = true }
wgpu = { version = "25.0.2", optional = true }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

[[example]]
name = "level_probe"
required-features = ["cpu"]

[[example]]
name = "render_bench"
required-features = ["cpu"]

[[example]]
name = "screenshot"
required-features = ["cpu"]
