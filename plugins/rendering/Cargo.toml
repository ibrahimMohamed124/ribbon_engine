[package]
name = "ribbon_plugin_rendering"
version = "0.1.0"
edition = "2021"

[features]
default = ["cpu", "gpu"]
cpu = ["dep:rayon"]
gpu = ["ribbon_render/gpu", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
ribbon_app = { path = "../../crates/ribbon_app" }
ribbon_plugins = { path = "../../crates/ribbon_plugins" }
ribbon_ecs = { path = "../../crates/ribbon_ecs" }
ribbon_events = { path = "../../crates/ribbon_events" }
ribbon_assets = { path = "../../crates/ribbon_assets" }
ribbon_platform = { path = "../../crates/ribbon_platform" }
ribbon_scene = { path = "../../crates/ribbon_scene" }
ribbon_math = { path = "../../crates/ribbon_math" }
ribbon_plugin_voxel = { path = "../voxel" }
ribbon_render = { path = "../../crates/ribbon_render", default-features = false }
rayon = { version = "1.10", optional = true }
wgpu = { version = "25.0.2", optional = true }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

[[example]]
name = "level_probe"
required-features = ["cpu"]

[[example]]
name = "render_bench"
required-features = ["cpu"]

[[example]]
name = "screenshot"
required-features = ["cpu"]
